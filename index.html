
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATLAS | Global Vehicle Encyclopedia</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a1020;color:#edf3ff;font-family:Arial,sans-serif}
header{padding:25px 5%;background:#111c32;border-bottom:1px solid #293954}
h1{margin:0;color:#65d9ff;letter-spacing:4px}
header p{color:#aebbd2}
main{max-width:1400px;margin:auto;padding:22px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
input,select{background:#15233b;color:white;border:1px solid #344967;padding:12px;border-radius:8px;flex:1;min-width:170px}
#count{color:#9eb1cf;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#111c30;border:1px solid #283b58;border-radius:12px;overflow:hidden}
.photo{height:165px;background:#1b2b43;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.fallback{font-size:58px}
.info{padding:15px}
.info h3{margin:0 0 10px;font-size:17px}
.meta{font-size:12px;color:#a9bad5;margin-bottom:12px}
button{background:#087ca5;color:white;border:0;border-radius:7px;padding:10px 13px;cursor:pointer}
button:hover{background:#0a9ccc}
#modal{display:none;position:fixed;inset:0;background:#000c;z-index:5;overflow:auto;padding:20px}
.panel{max-width:650px;margin:5vh auto;background:#111c30;border:1px solid #344967;border-radius:12px;padding:20px}
.panel img{width:100%;max-height:330px;object-fit:contain;background:#1b2b43}
.close{float:right}
footer{text-align:center;padding:25px;color:#8394b1}
</style>
</head>
<body>
<header>
<h1>ATLAS</h1>
<p>GLOBAL VEHICLE ENCYCLOPEDIA · AIR · SEA · LAND · SPACE</p>
</header>
<main>
<div class="controls">
<input id="search" placeholder="Search vehicles..." aria-label="Search vehicles">
<select id="category" aria-label="Filter by category"><option value="">All categories</option></select>
<select id="country" aria-label="Filter by country"><option value="">All countries</option></select>
</div>
<div id="count"></div>
<div id="grid" class="grid"></div>
</main>
<div id="modal" role="dialog" aria-modal="true">
<div class="panel">
<button class="close" onclick="closeProfile()">Close ✕</button>
<div id="details"></div>
</div>
</div>
<footer>ATLAS · Global Vehicle Encyclopedia</footer>
<script>
"use strict";

/* 25 entries in each of 8 categories = 200 profiles.
   Photos are searched online; Commons search results should be checked. */
const groups={
"Aircraft":[
"Airbus A380","Boeing 747","Boeing 787 Dreamliner","Airbus A350",
"Airbus A320","Boeing 737","Concorde","Lockheed SR-71 Blackbird",
"F-22 Raptor","F-35 Lightning II","Sukhoi Su-57","Dassault Rafale",
"Eurofighter Typhoon","F-16 Fighting Falcon","F-15 Eagle",
"MiG-29","Sukhoi Su-30MKI","B-2 Spirit","B-52 Stratofortress",
"C-130 Hercules","C-17 Globemaster III","Antonov An-225",
"Embraer E195","Boeing AH-64 Apache","Mil Mi-26"
],
"Ships":[
"USS Gerald R. Ford","USS Nimitz","INS Vikrant aircraft carrier","INS Arihant",
"INS Visakhapatnam","HMS Queen Elizabeth aircraft carrier","Admiral Kuznetsov",
"Yamato battleship","USS Missouri battleship","Arleigh Burke-class destroyer",
"Type 055 destroyer","Kolkata-class destroyer","Virginia-class submarine",
"Astute-class submarine","Typhoon-class submarine","Kilo-class submarine",
"Queen Mary 2","Titanic ship","Ever Given container ship","Emma Maersk",
"Freedom of the Seas","Zumwalt-class destroyer","INS Chennai warship",
"INS Kolkata warship","USS Constitution"
],
"Cars":[
"Toyota Supra","Nissan GT-R","Porsche 911","Ferrari F40","Ferrari SF90",
"Lamborghini Aventador","Lamborghini Revuelto","Bugatti Chiron",
"Bugatti Tourbillon","McLaren P1","McLaren 720S","Koenigsegg Jesko",
"Koenigsegg Agera","Pagani Huayra","Aston Martin Valkyrie",
"Mercedes-Benz S-Class","BMW M5","Audi R8","Ford Mustang",
"Chevrolet Corvette","Dodge Challenger","Tesla Model S","Tata Nexon",
"Mahindra Thar","Maruti Suzuki Swift"
],
"Trains":[
"Shinkansen N700S","TGV Duplex","ICE 3 train","Eurostar e320",
"Shanghai Maglev","Vande Bharat Express","Gatimaan Express",
"Rajdhani Express","Duronto Express","Indian Railways WAP-7",
"Indian Railways WAG-9","Indian Railways WDM-3A","Flying Scotsman locomotive",
"Union Pacific Big Boy","Mallard locomotive","Orient Express train",
"California Zephyr","Amtrak Acela","JR East E5 Series",
"CR400 Fuxing train","Talgo Avril","Bombardier TRAXX",
"Stadler FLIRT","Delhi Metro train","Kolkata Metro train"
],
"Construction":[
"Caterpillar 797F","Caterpillar D11 bulldozer","Komatsu D575A",
"Komatsu 980E mining truck","Liebherr T 282B","BelAZ 75710",
"Hitachi EX8000 excavator","Komatsu PC8000 excavator",
"Caterpillar 320 excavator","JCB 3DX backhoe loader",
"JCB Fastrac tractor","Volvo A60H articulated hauler",
"Volvo EC950F excavator","Liebherr LTM 11200 crane",
"Terex AC 1000 crane","SANY SY500H excavator",
"XCMG XE7000 excavator","John Deere 9RX tractor",
"Case IH Steiger tractor","New Holland T7 tractor",
"Bomag BW 219 roller","Caterpillar 140 grader",
"Komatsu WA1200 loader","Putzmeister concrete pump",
"Sandvik underground mining loader"
],
"Spacecraft":[
"Apollo Lunar Module","Space Shuttle Discovery","Space Shuttle Atlantis",
"SpaceX Dragon spacecraft","SpaceX Starship","Falcon 9 rocket",
"Falcon Heavy rocket","Saturn V rocket","SLS rocket",
"NASA Orion spacecraft","Soyuz spacecraft","Shenzhou spacecraft",
"Blue Origin New Shepard","Blue Origin New Glenn",
"Ariane 5 rocket","Ariane 6 rocket","ISRO LVM3 rocket",
"ISRO PSLV rocket","GSLV Mk III rocket","Hubble Space Telescope",
"James Webb Space Telescope","Voyager 1 spacecraft",
"Perseverance rover","Curiosity rover","Chandrayaan-3 lander"
],
"Robots":[
"Boston Dynamics Atlas robot","Boston Dynamics Spot robot",
"NASA Valkyrie robot","ASIMO robot","Unitree Go2 robot",
"Unitree H1 humanoid robot","Tesla Optimus robot","Digit humanoid robot",
"Ameca humanoid robot","Pepper robot","NAO humanoid robot",
"Robonaut 2","NASA Sojourner rover","NASA Spirit rover",
"NASA Opportunity rover","NASA Zhurong rover","Lunar Roving Vehicle",
"iRobot PackBot","QinetiQ TALON robot","ANYmal quadruped robot",
"Agility Robotics Digit","KUKA industrial robot","ABB IRB 6700 robot",
"FANUC industrial robot","Universal Robots UR10"
],
"Military Vehicles":[
"M1 Abrams tank","Leopard 2 tank","Challenger 2 tank","T-90 Bhishma tank",
"Arjun Mk1A tank","T-14 Armata tank","Merkava Mk4 tank",
"K2 Black Panther tank","Type 99 tank","M2 Bradley fighting vehicle",
"CV90 infantry fighting vehicle","BMP-3 infantry fighting vehicle",
"Stryker armoured vehicle","Boxer armoured vehicle","Patria AMV",
"Rafale fighter aircraft","F-16 Fighting Falcon","F-22 Raptor",
"F-35 Lightning II","Sukhoi Su-30MKI","C-17 Globemaster III",
"CH-47 Chinook","AH-64 Apache","S-400 air defence system",
"NASAMS air defence system"
]
};

const countries={
"Airbus":"France / Europe","Boeing":"United States",
"Lockheed":"United States","Sukhoi":"Russia","Dassault":"France",
"Eurofighter":"Europe","MiG":"Russia","Antonov":"Ukraine",
"Embraer":"Brazil","INS":"India","Indian Railways":"India",
"Vande Bharat":"India","Gatimaan":"India","Rajdhani":"India",
"Duronto":"India","Delhi Metro":"India","Kolkata Metro":"India",
"Tata":"India","Mahindra":"India","Maruti":"India","ISRO":"India",
"Chandrayaan":"India","Shinkansen":"Japan","JR East":"Japan",
"Komatsu":"Japan","Hitachi":"Japan","Toyota":"Japan","Nissan":"Japan",
"Ferrari":"Italy","Lamborghini":"Italy","Bugatti":"France",
"Koenigsegg":"Sweden","Pagani":"Italy","Porsche":"Germany",
"BMW":"Germany","Audi":"Germany","Mercedes-Benz":"Germany",
"Volvo":"Sweden","Saab":"Sweden","SpaceX":"United States",
"NASA":"United States","Blue Origin":"United States",
"Boston Dynamics":"United States","Unitree":"China",
"Tesla":"United States","Caterpillar":"United States",
"JCB":"United Kingdom","Liebherr":"Switzerland / Germany",
"BelAZ":"Belarus","SANY":"China","XCMG":"China",
"John Deere":"United States","Case IH":"United States",
"New Holland":"Italy / United States","KUKA":"Germany",
"ABB":"Switzerland","FANUC":"Japan","Universal Robots":"Denmark",
"Leopard":"Germany","M1 Abrams":"United States",
"Challenger":"United Kingdom","T-90":"Russia","Arjun":"India",
"Rafale":"France","F-16":"United States","F-22":"United States",
"F-35":"United States","CH-47":"United States","AH-64":"United States"
};

function countryOf(name){
 for(const [prefix,country] of Object.entries(countries))
  if(name.startsWith(prefix)) return country;
 if(/USS |Boeing|Ford Mustang|Chevrolet|Dodge|Amtrak|Space Shuttle|Falcon |Apollo |Orion |Hubble|James Webb|Voyager|Perseverance|Curiosity|M1 Abrams|Stryker|Bradley|NASA /.test(name)) return "United States";
 if(/TGV|Ariane|Dassault|Rafale|Airbus|Bugatti/.test(name)) return "France / Europe";
 if(/Sukhoi|MiG|T-90|Armata|Kuznetsov/.test(name)) return "Russia";
 if(/Shinkansen|Toyota|Nissan|Komatsu|Hitachi|FANUC|ASIMO/.test(name)) return "Japan";
 if(/INS |Arjun|Tata|Mahindra|Maruti|ISRO|Chandrayaan|Vande Bharat/.test(name)) return "India";
 if(/China|Fuxing|Zhurong|Unitree|SANY|XCMG/.test(name)) return "China";
 return "International";
}

const catalogue=[];
for(const [category,names] of Object.entries(groups)){
 for(const name of names){
  catalogue.push({name,category,country:countryOf(name)});
 }
}
if(catalogue.length!==200) console.warn("Catalogue entries:",catalogue.length);

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const cat=document.getElementById("category");
const country=document.getElementById("country");
const count=document.getElementById("count");
const cache=new Map();

[...new Set(catalogue.map(x=>x.category))].sort().forEach(x=>cat.add(new Option(x,x)));
[...new Set(catalogue.map(x=>x.country))].sort().forEach(x=>country.add(new Option(x,x)));

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fallbackSVG(name,category){
 const label=(name+"").replace(/[<>&"]/g,"").slice(0,34);
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330">
 <rect width="600" height="330" fill="#172944"/>
 <path d="M40 245H560" stroke="#3c587c" stroke-width="3"/>
 <g fill="#5dd7ff" opacity=".85">
 <path d="M125 178h350l-48 34H173z"/>
 <circle cx="205" cy="226" r="20"/><circle cx="395" cy="226" r="20"/>
 </g>
 <text x="300" y="65" fill="#eaf4ff" font-size="23" text-anchor="middle">${escapeHTML(category)}</text>
 <text x="300" y="290" fill="#eaf4ff" font-size="19" text-anchor="middle">${escapeHTML(label)}</text>
 </svg>`;
 return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}
async function vehicleImage(item){
 if(cache.has(item.name)) return cache.get(item.name);
 const promise=(async()=>{
  try{
   const query=encodeURIComponent(item.name);
   const url=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${query}&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url&iiurlwidth=600&format=json&origin=*`;
   const response=await fetch(url);
   if(!response.ok) throw new Error("Image search failed");
   const data=await response.json();
   const pages=Object.values(data.query?.pages||{});
   const norm=s=>s.toLowerCase().replace(/\.[^.]+$/,"").replace(/[^a-z0-9]+/g," ").trim();
   const words=norm(item.name).split(" ").filter(w=>w.length>2);
   const ranked=pages.map(p=>{
    const title=norm(p.title||"");
    const score=words.reduce((n,w)=>n+(title.includes(w)?1:0),0);
    return {score,url:p.imageinfo?.[0]?.thumburl||p.imageinfo?.[0]?.url};
   }).filter(p=>p.url&&p.score>=Math.max(2,Math.ceil(words.length*.5)));
   ranked.sort((a,b)=>b.score-a.score);
   return ranked[0]?.url||fallbackSVG(item.name,item.category);
  }catch(e){
   return fallbackSVG(item.name,item.category);
  }
 })();
 cache.set(item.name,promise);
 return promise;
}
function loadImage(img,item){
 vehicleImage(item).then(url=>{
  img.src=url;
  img.alt=item.name;
 });
}
function showProfile(item){
 const modal=document.getElementById("modal");
 document.getElementById("details").innerHTML=
 `<h2>${escapeHTML(item.name)}</h2>
 <p><b>Category:</b> ${escapeHTML(item.category)}</p>
 <p><b>Country:</b> ${escapeHTML(item.country)}</p>
 <img id="profileImage" alt="${escapeHTML(item.name)}" src="${fallbackSVG(item.name,item.category)}">
 <p>Image results are retrieved from Wikimedia Commons when available. Check the source image to confirm the exact model.</p>`;
 modal.style.display="block";
 const img=document.getElementById("profileImage");
 loadImage(img,item);
}
function closeProfile(){document.getElementById("modal").style.display="none"}
document.getElementById("modal").addEventListener("click",e=>{
 if(e.target.id==="modal") closeProfile();
});
function render(){
 const q=search.value.toLowerCase().trim();
 const items=catalogue.filter(x=>
  (!q||(x.name+" "+x.category+" "+x.country).toLowerCase().includes(q))&&
  (!cat.value||x.category===cat.value)&&
  (!country.value||x.country===country.value)
 );
 count.textContent=`Showing ${items.length} of ${catalogue.length} vehicles`;
 grid.innerHTML=items.map((x,i)=>`
 <article class="card">
  <div class="photo"><img loading="lazy" data-item="${catalogue.indexOf(x)}" src="${fallbackSVG(x.name,x.category)}" alt="${escapeHTML(x.name)}"></div>
  <div class="info">
   <h3>${escapeHTML(x.name)}</h3>
   <div class="meta">${escapeHTML(x.category)} · ${escapeHTML(x.country)}</div>
   <button data-profile="${catalogue.indexOf(x)}">View profile</button>
  </div>
 </article>`).join("");
 grid.querySelectorAll("img[data-item]").forEach(img=>{
  loadImage(img,catalogue[Number(img.dataset.item)]);
 });
 grid.querySelectorAll("button[data-profile]").forEach(btn=>{
  btn.addEventListener("click",()=>showProfile(catalogue[Number(btn.dataset.profile)]));
 });
}
search.addEventListener("input",render);
cat.addEventListener("change",render);
country.addEventListener("change",render);
render();
</script>
</body>
</html>
